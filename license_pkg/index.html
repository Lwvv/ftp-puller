<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTP Puller 授权生成器</title>
<style>
  :root { --bg:#f5f7fa; --card:#ffffff; --line:#e3e8ef; --txt:#1f2933; --muted:#667085;
          --brand:#2f6fed; --brand-d:#1c53c9; --ok:#117a3a; --bad:#c0392b; --warn:#b7791f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:20px; margin-bottom:20px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .card h2 { font-size:16px; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; }
  input[type=date], textarea { width:100%; padding:10px 12px; font-size:14px;
          border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--txt); }
  input[type=date] { max-width:240px; }
  textarea { resize:vertical; min-height:90px; font-family:ui-monospace,Consolas,monospace; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { cursor:pointer; border:none; border-radius:8px; font-size:15px; font-weight:600;
           padding:12px 20px; background:var(--brand); color:#fff; transition:.15s; }
  button:hover { background:var(--brand-d); }
  button.ghost { background:#eef2ff; color:var(--brand-d); }
  button.green { background:var(--ok); }
  button.green:hover { background:#0e6630; }
  .note { font-size:12px; color:var(--muted); margin-top:10px; }
  .result { margin-top:14px; padding:12px 14px; border-radius:8px; font-size:14px; font-weight:600; display:none; }
  .result.ok { background:#e7f6ed; color:var(--ok); border:1px solid #b7e4c7; display:block; }
  .result.bad { background:#fdecea; color:var(--bad); border:1px solid #f5c6c0; display:block; }
  .result.warn { background:#fdf3e2; color:var(--warn); border:1px solid #f3d8a8; display:block; }
  code { background:#eef1f6; padding:2px 6px; border-radius:5px; font-size:12px; }
  .warnbox { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412;
             padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:20px; }
  footer { font-size:12px; color:var(--muted); text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FTP Puller 授权生成器</h1>
  <p class="sub">离线使用 · 生成 <code>license.dat</code> 授权文件 · 与部署端二进制完全对应</p>

  <div class="warnbox">
    ⚠️ 本页面内含「授权密钥」，请妥善保管、不要外发给客户。把它当作"造钥匙的模具"——客户只需拿到生成的 <code>license.dat</code>。
  </div>

  <!-- 生成 -->
  <div class="card">
    <h2>① 生成授权文件</h2>
    <label for="expire">到期日期（必填）</label>
    <input type="date" id="expire">
    <label for="issued">签发日期（可留空，默认今天）</label>
    <input type="date" id="issued">
    <div class="row" style="margin-top:16px;">
      <button class="green" onclick="doGen()">生成 license.dat</button>
      <button class="ghost" onclick="copyText('out')">复制文本</button>
      <button class="ghost" onclick="download()">下载 license.dat</button>
    </div>
    <label for="out">授权内容（也可直接复制下面这段文字存成 license.dat）</label>
    <textarea id="out" readonly placeholder="点击上方「生成」按钮后，这里会出现授权内容"></textarea>
    <div class="note">部署时把 <code>license.dat</code> 放到二进制（ftp_puller）同目录即可。</div>
  </div>

  <!-- 校验 -->
  <div class="card">
    <h2>② 校验授权文件</h2>
    <label for="inbox">粘贴 license.dat 内容</label>
    <textarea id="inbox" placeholder="把已生成的授权内容粘贴到这里"></textarea>
    <div class="row" style="margin-top:14px;">
      <button onclick="doVerify()">校验</button>
    </div>
    <div id="vres" class="result"></div>
  </div>

  <footer>纯前端实现（SHA-256 / HMAC / PBKDF2 均由页面内 JS 完成），不联网、不上传，可离线打开。</footer>
</div>

<script>
// ============ 纯 JS 加密核心（与 Python license_core.py 算法一致） ============
function rotr(x, n) { return ((x >>> n) | (x << (32 - n))) >>> 0; }
const SHA_K = new Uint32Array([
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
]);
function sha256(msg) {
  let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  const l=msg.length, bitLen=l*8, withOne=l+1, k=(56-(withOne%64)+64)%64, total=withOne+k+8;
  const buf=new Uint8Array(total); buf.set(msg,0); buf[l]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(total-8, Math.floor(bitLen/0x100000000), false);
  dv.setUint32(total-4, bitLen>>>0, false);
  const w=new Uint32Array(64);
  for(let off=0; off<total; off+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(off+i*4,false);
    for(let i=16;i<64;i++){
      const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);
      const s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,hh=h7;
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^((~e)&g), t1=(hh+S1+ch+SHA_K[i]+w[i])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22), maj=(a&b)^(a&c)^(b&c), t2=(S0+maj)|0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;h5=(h5+f)|0;h6=(h6+g)|0;h7=(h7+hh)|0;
  }
  const out=new Uint8Array(32), odv=new DataView(out.buffer), H=[h0,h1,h2,h3,h4,h5,h6,h7];
  for(let i=0;i<8;i++) odv.setUint32(i*4,H[i],false);
  return out;
}
function concatBytes(a,b){ const c=new Uint8Array(a.length+b.length); c.set(a,0); c.set(b,a.length); return c; }
function hmac_sha256(key,msg){
  const B=64, keyB=new Uint8Array(B);
  if(key.length>B){ keyB.set(sha256(key),0); } else { keyB.set(key,0); }
  const ikey=new Uint8Array(B), okey=new Uint8Array(B);
  for(let i=0;i<B;i++){ ikey[i]=keyB[i]^0x36; okey[i]=keyB[i]^0x5c; }
  const inner=sha256(concatBytes(ikey,msg));
  return sha256(concatBytes(okey,inner));
}
function int32be(n){ return new Uint8Array([(n>>>24)&0xff,(n>>>16)&0xff,(n>>>8)&0xff,n&0xff]); }
function pbkdf2_hmac_sha256(pw,salt,iters,dkLen){
  const T=new Uint8Array(dkLen), blocks=Math.ceil(dkLen/32);
  for(let i=1;i<=blocks;i++){
    let U=hmac_sha256(pw,concatBytes(salt,int32be(i))); const Tb=U.slice();
    for(let j=1;j<iters;j++){ U=hmac_sha256(pw,U); for(let t=0;t<32;t++) Tb[t]^=U[t]; }
    T.set(Tb,(i-1)*32);
  }
  return T;
}
function xorBytes(a,key){ const o=new Uint8Array(a.length); for(let i=0;i<a.length;i++) o[i]=a[i]^key[i%key.length]; return o; }
const B64C="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
function b64encode(b){
  let s="",i; for(i=0;i+2<b.length;i+=3){ const n=(b[i]<<16)|(b[i+1]<<8)|b[i+2]; s+=B64C[(n>>18)&63]+B64C[(n>>12)&63]+B64C[(n>>6)&63]+B64C[n&63]; }
  const rem=b.length-i;
  if(rem===1){ const n=b[i]<<16; s+=B64C[(n>>18)&63]+B64C[(n>>12)&63]+"=="; }
  else if(rem===2){ const n=(b[i]<<16)|(b[i+1]<<8); s+=B64C[(n>>18)&63]+B64C[(n>>12)&63]+B64C[(n>>6)&63]+"="; }
  return s;
}
function b64decode(str){
  str=str.replace(/[^A-Za-z0-9+/=]/g,""); const out=[];
  for(let i=0;i<str.length;){
    const a=Math.max(0,B64C.indexOf(str[i++])),b=Math.max(0,B64C.indexOf(str[i++]));
    const c=Math.max(0,B64C.indexOf(str[i++])),d=Math.max(0,B64C.indexOf(str[i++]));
    const n=(a<<18)|(b<<12)|(c<<6)|d; out.push((n>>16)&0xff);
    if(str[i-2]!=='=') out.push((n>>8)&0xff); if(str[i-1]!=='=') out.push(n&0xff);
  }
  return new Uint8Array(out);
}
function utf8encode(str){ const o=[]; for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i);
  if(c<0x80) o.push(c); else if(c<0x800) o.push(0xc0|(c>>6),0x80|(c&0x3f)); else o.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f)); }
  return new Uint8Array(o); }
const AUTH_KEY_STR="FTP-PULLER-AUTH-KEY-2026-GOLDENCIS-9f3a2c7b";
const SALT_STR="ftp-puller-license-salt-v1";
function pad2(n){ return (n<10?"0":"")+n; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function make_license(expire, issued){
  if(!issued) issued=todayISO();
  const docStr='{"expire": "'+expire+'", "issued": "'+issued+'"}';
  const doc=utf8encode(docStr), key=utf8encode(AUTH_KEY_STR), salt=utf8encode(SALT_STR);
  const dk=pbkdf2_hmac_sha256(key,salt,10000,32);
  const enc=xorBytes(doc,dk), mac=hmac_sha256(dk,enc);
  return b64encode(concatBytes(enc,mac));
}
function verify_license(blob){
  let raw; try{ raw=b64decode(blob); }catch(e){ return {ok:false,msg:"授权文件不是合法的 base64 编码"}; }
  if(raw.length<33) return {ok:false,msg:"授权文件长度异常(可能被截断或篡改)"};
  const enc=raw.subarray(0,raw.length-32), mac=raw.subarray(raw.length-32);
  const key=utf8encode(AUTH_KEY_STR), salt=utf8encode(SALT_STR), dk=pbkdf2_hmac_sha256(key,salt,10000,32);
  const calc=hmac_sha256(dk,enc); let same=calc.length===mac.length;
  for(let i=0;i<calc.length&&same;i++) if(calc[i]!==mac[i]) same=false;
  if(!same) return {ok:false,msg:"授权文件签名校验失败(可能被篡改)"};
  const db=xorBytes(enc,dk); let ds=""; for(let i=0;i<db.length;i++) ds+=String.fromCharCode(db[i]);
  let doc; try{ doc=JSON.parse(ds); }catch(e){ return {ok:false,msg:"授权文件解密失败(可能密钥不匹配或被破坏)"}; }
  const exp=doc.expire; if(!exp) return {ok:false,msg:"授权文件缺少到期字段"};
  const m=exp.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return {ok:false,msg:"授权到期日期格式错误: "+exp};
  const ed=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3])), today=new Date();
  today.setHours(0,0,0,0); ed.setHours(0,0,0,0);
  const days=Math.round((ed-today)/86400000);
  if(days<0) return {ok:false,msg:"授权已过期 (到期 "+exp+", 今天 "+todayISO()+")"};
  return {ok:true,msg:"授权有效 (到期 "+exp+", 剩余 "+days+" 天)"};
}

// ============ 界面逻辑 ============
function doGen(){
  const exp=document.getElementById('expire').value;
  const iss=document.getElementById('issued').value;
  if(!exp){ alert("请先填写到期日期"); return; }
  const blob=make_license(exp, iss||undefined);
  document.getElementById('out').value=blob;
}
function copyText(id){
  const el=document.getElementById(id); if(!el.value){ return; }
  el.select();
  try{ navigator.clipboard.writeText(el.value); }catch(e){ document.execCommand('copy'); }
}
function download(){
  const el=document.getElementById('out'); if(!el.value){ alert("请先生成授权"); return; }
  const b=new Blob([el.value],{type:"text/plain"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download="license.dat"; a.click();
  URL.revokeObjectURL(a.href);
}
function doVerify(){
  const v=verify_license(document.getElementById('inbox').value.trim());
  const r=document.getElementById('vres');
  r.className='result '+(v.ok?'ok':'bad');
  r.textContent=(v.ok?'✔ ':'✘ ')+v.msg;
}
// 默认到期填一个示例(一年), 签发填今天
(function(){ const d=new Date(); const nxt=new Date(d.getFullYear()+1,d.getMonth(),d.getDate());
  document.getElementById('expire').value=nxt.getFullYear()+"-"+pad2(nxt.getMonth()+1)+"-"+pad2(nxt.getDate());
  document.getElementById('issued').value=todayISO();
})();
</script>
</body>
</html>
