# ============================================================
# vsftpd 配置 (离线安装生成)
# 适用: openEuler 24.03 SP3 x86_64 / vsftpd 3.0.5
# 安全取向: 关闭匿名, 仅允许本地账户(ftpadmin)登录并被锁在家目录
# 重要: vsftpd 不支持行内 # 注释! 所有说明必须单独成行(行首#),
#       否则启动会报 "bad bool value in config file" 直接退出
# ============================================================

# ---------- 监听 ----------
listen=YES
listen_ipv6=NO

# ---------- 登录控制 ----------
# 关匿名, 避免被扫
anonymous_enable=NO
# 允许本地账户(ftpadmin)登录
local_enable=YES
# 允许上传/删除(搬家式抽取需要)
write_enable=YES
local_umask=022

# ---------- 安全边界: 把用户锁在家目录 ----------
# 登录后只能看到自己的目录, 跑不出 /
chroot_local_user=YES
# 允许家目录可写(否则 chroot 拒绝启动)
allow_writeable_chroot=YES

# ---------- 被动模式(跨网段/跨防火墙必开) ----------
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=31000
# 不写死 pasv_address: 让 vsftpd 自动用"控制连接进来的那个网卡 IP"作为被动地址
#   - 本地用 127.0.0.1 连 -> 回 127.0.0.1 (避免回环包被拒, 本地 ftp 客户端 ls 才正常)
#   - 远端拉取机连 -> 回本机 LAN IP (跨机可连, 抽取脚本才正常)
# 若服务器在 NAT 之后, 被动端口需对外公布公网 IP, 再手动设 pasv_address=公网IP

# ---------- 用户白名单(只有列在 user_list 的才能登) ----------
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd/user_list

# ---------- PAM / 日志 ----------
pam_service_name=vsftpd
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=NO
# 详细日志, 便于排错
log_ftp_protocol=YES
dirmessage_enable=YES
