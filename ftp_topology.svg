<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="760" height="420" fill="#f4f6f9"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">FTP 文件抽取链路拓扑（准实时 · 搬家式）</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#7a869a">源端 132 ──被 131 抽取──▶ 131 双角色 ──被网闸抽取──▶ 网闸</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3a7afe"/>
    </marker>
  </defs>

  <!-- 节点1: 132 源服务器 -->
  <rect x="24" y="110" width="210" height="210" rx="12" fill="#ffffff" stroke="#3a7afe" stroke-width="2"/>
  <text x="129" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a7afe">源服务器</text>
  <text x="129" y="158" text-anchor="middle" font-size="13" fill="#1f2d3d">192.168.5.132</text>
  <line x1="44" y1="170" x2="214" y2="170" stroke="#e3e8ef" stroke-width="1"/>
  <text x="44" y="192" font-size="12" fill="#5a6577">角色：被抽取端</text>
  <text x="44" y="214" font-size="12" fill="#5a6577">服务：vsftpd</text>
  <text x="44" y="236" font-size="12" fill="#5a6577">账户：ftp / CHANGE_ME_SOURCE_PASSWORD</text>
  <text x="44" y="262" font-size="12" fill="#5a6577">目录：/home/ftp</text>
  <text x="44" y="284" font-size="11" fill="#9aa4b2">（业务文件放这里）</text>
  <rect x="44" y="300" width="170" height="10" rx="3" fill="#eef3ff"/>

  <!-- 节点2: 131 双角色 -->
  <rect x="275" y="90" width="240" height="250" rx="12" fill="#ffffff" stroke="#ff8c2e" stroke-width="2"/>
  <text x="395" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#ff8c2e">拉取服务器（双角色）</text>
  <text x="395" y="138" text-anchor="middle" font-size="13" fill="#1f2d3d">192.168.5.131</text>
  <line x1="295" y1="150" x2="495" y2="150" stroke="#e3e8ef" stroke-width="1"/>

  <!-- 角色A -->
  <text x="295" y="172" font-size="12" font-weight="bold" fill="#2b6cff">角色A：抽取端 ftp_puller</text>
  <text x="295" y="192" font-size="11" fill="#5a6577">· 以 root 运行，每 30s 轮询</text>
  <text x="295" y="210" font-size="11" fill="#5a6577">· 从 132 抽文件 + 校验</text>
  <text x="295" y="228" font-size="11" fill="#5a6577">· 落盘目录：/home/ftpadmin</text>

  <line x1="295" y1="242" x2="495" y2="242" stroke="#e3e8ef" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 角色B -->
  <text x="295" y="264" font-size="12" font-weight="bold" fill="#ff8c2e">角色B：网闸对接端 vsftpd</text>
  <text x="295" y="284" font-size="11" fill="#5a6577">· 账户：ftpadmin</text>
  <text x="295" y="302" font-size="11" fill="#5a6577">· 密码：CHANGE_ME_GATEWAY_PASSWORD</text>
  <text x="295" y="320" font-size="11" fill="#5a6577">· 目录：/home/ftpadmin</text>

  <!-- 节点3: 网闸 -->
  <rect x="556" y="130" width="180" height="150" rx="12" fill="#ffffff" stroke="#7a869a" stroke-width="2"/>
  <text x="646" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a869a">网闸</text>
  <line x1="576" y1="172" x2="716" y2="172" stroke="#e3e8ef" stroke-width="1"/>
  <text x="576" y="196" font-size="12" fill="#5a6577">从 131 抽取文件</text>
  <text x="576" y="218" font-size="12" fill="#5a6577">地址：192.168.5.131:21</text>
  <text x="576" y="240" font-size="12" fill="#5a6577">账号：ftpadmin</text>
  <text x="576" y="262" font-size="12" fill="#5a6577">目录：/home/ftpadmin</text>

  <!-- 箭头1 -->
  <line x1="234" y1="215" x2="271" y2="215" stroke="#3a7afe" stroke-width="2.5" marker-end="url(#arw)"/>
  <rect x="200" y="225" width="80" height="34" rx="6" fill="#eef3ff"/>
  <text x="240" y="240" text-anchor="middle" font-size="10" fill="#3a7afe">FTP 抽取</text>
  <text x="240" y="253" text-anchor="middle" font-size="9" fill="#7a869a">校验后删源</text>

  <!-- 箭头2 -->
  <line x1="515" y1="200" x2="553" y2="200" stroke="#3a7afe" stroke-width="2.5" marker-end="url(#arw)"/>
  <rect x="480" y="160" width="78" height="34" rx="6" fill="#fff3e8"/>
  <text x="519" y="175" text-anchor="middle" font-size="10" fill="#ff8c2e">网闸抽取</text>
  <text x="519" y="188" text-anchor="middle" font-size="9" fill="#7a869a">FTP 拉走</text>

  <!-- 底部图例 -->
  <text x="24" y="400" font-size="11" fill="#9aa4b2">说明：实线箭头为 FTP 数据传输方向；131 同时承担"从 132 拉取"与"向网闸提供"两个角色。</text>
</svg>
